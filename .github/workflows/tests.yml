name: Tests

# Test suites of the core package and of the finite element back ends, one job each. Packages,
# artifacts and precompiled code are cached between runs (julia-actions/cache), so after the
# first run a job mostly runs tests.
# (Only master: redo is pushed together with it, which would run everything twice.)
on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "ext/**"
      - "lib/**"
      - "test/**"
      - "Project.toml"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ModularEIT          # LinearSolvers, Optimization, Data, AD, Reconstruction
            project: .
          - package: ModularEITFerrite   # Galerkin, Adaptivity, Images
            project: lib/ModularEITFerrite
          - package: ModularEITGridap    # comparison with the Ferrite back end, Gridap models
            project: lib/ModularEITGridap
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=${{ matrix.project }} -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        run: julia --project=${{ matrix.project }} -e 'using Pkg; Pkg.test()'

